# ========================================================
# HOSTEL MANAGEMENT SYSTEM - APPLICATION CONFIGURATION
# College Java Full Stack Mini Project
# ========================================================

# Server Configuration
server.port=8080

# Primary MySQL Database Configuration (Per Project Report Page 4 & 9)
spring.datasource.url=jdbc:mysql://localhost:3306/hostel_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 Console (available when fallback is active at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Application Details
spring.application.name=Hostel-Management-System

# Jackson Date Formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Asia/Kolkata

# Logging
logging.level.com.hostelmanagement=INFO
logging.level.org.springframework.jdbc.core=INFO
