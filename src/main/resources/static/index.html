<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Management System - Admin Login</title>
    <meta name="description" content="Secure administrative login for Hostel Management System">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <div class="login-card-wrapper">
        <div class="login-box">
            <div class="login-header">
                <div class="login-header-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </div>
                <h2>Hostel Admin Portal</h2>
                <p>College Java Full Stack Mini Project</p>
            </div>

            <!-- Demo Credentials Helper Callout -->
            <div class="credentials-callout">
                <div style="font-weight: 600; margin-bottom: 2px;">Default Demo Credentials:</div>
                <div>Username: <strong>admin</strong> &nbsp;|&nbsp; Password: <strong>admin123</strong></div>
            </div>

            <form id="loginForm">
                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="username">Username <span class="req">*</span></label>
                    <input type="text" id="username" class="form-control" placeholder="Enter administrator username" required autofocus autocomplete="username">
                </div>

                <div class="form-group" style="margin-bottom: 24px;">
                    <label for="password">Password <span class="req">*</span></label>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
                </div>

                <button type="submit" id="btnLogin" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 0.95rem;">
                    <span>Sign In to Dashboard</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <div style="margin-top: 24px; text-align: center; font-size: 0.76rem; color: #94a3b8;">
                Layered MVC + REST API &bull; Spring Boot &bull; JDBC &bull; MySQL
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Check if already authenticated
            const admin = await HMS.checkAuth(false);
            if (admin) {
                window.location.href = 'dashboard.html';
                return;
            }

            const loginForm = document.getElementById('loginForm');
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();

                const btn = document.getElementById('btnLogin');
                const origText = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<span>Signing in...</span>';

                try {
                    const data = await HMS.api('/api/auth/login', {
                        method: 'POST',
                        body: JSON.stringify({ username, password })
                    });

                    HMS.toast('Welcome back, ' + (data.admin.fullName || data.admin.username), 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 400);
                } catch (err) {
                    HMS.toast(err.message || 'Invalid username or password', 'error');
                    btn.disabled = false;
                    btn.innerHTML = origText;
                }
            });
        });
    </script>
</body>
</html>
